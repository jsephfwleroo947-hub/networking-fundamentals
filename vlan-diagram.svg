<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1200" height="610" fill="#FFFFFF"/>
<text x="40" y="38" font-size="22" font-weight="bold" fill="#1F3864">One switch carved into three VLANs</text>
<rect x="40" y="330" width="340" height="190" rx="14" fill="#EAF2FB" stroke="#2F5496" stroke-width="2" stroke-dasharray="8 5"/>
<text x="210.0" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F5496">VLAN 10: Staff</text>
<text x="210.0" y="480" text-anchor="middle" font-size="13" fill="#2F5496">Subnet 10.10.10.0/24</text>
<text x="210.0" y="500" text-anchor="middle" font-size="13" fill="#2F5496">Gateway 10.10.10.1</text>
<line x1="135.0" y1="370" x2="135.0" y2="250" stroke="#2F5496" stroke-width="3"/>
<line x1="285.0" y1="370" x2="285.0" y2="250" stroke="#2F5496" stroke-width="3"/>
<text x="210.0" y="305" text-anchor="middle" font-size="12" fill="#2F5496">Access ports</text>
<text x="210.0" y="319" text-anchor="middle" font-size="12" fill="#2F5496">(VLAN 10)</text>
<rect x="410" y="330" width="340" height="190" rx="14" fill="#EAF6EE" stroke="#2E7D4F" stroke-width="2" stroke-dasharray="8 5"/>
<text x="580.0" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D4F">VLAN 20: Servers</text>
<text x="580.0" y="480" text-anchor="middle" font-size="13" fill="#2E7D4F">Subnet 10.10.20.0/24</text>
<text x="580.0" y="500" text-anchor="middle" font-size="13" fill="#2E7D4F">Gateway 10.10.20.1</text>
<line x1="505.0" y1="370" x2="505.0" y2="250" stroke="#2E7D4F" stroke-width="3"/>
<line x1="655.0" y1="370" x2="655.0" y2="250" stroke="#2E7D4F" stroke-width="3"/>
<text x="580.0" y="305" text-anchor="middle" font-size="12" fill="#2E7D4F">Access ports</text>
<text x="580.0" y="319" text-anchor="middle" font-size="12" fill="#2E7D4F">(VLAN 20)</text>
<rect x="780" y="330" width="340" height="190" rx="14" fill="#F2E9F8" stroke="#7030A0" stroke-width="2" stroke-dasharray="8 5"/>
<text x="950.0" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#7030A0">VLAN 30: Guests</text>
<text x="950.0" y="480" text-anchor="middle" font-size="13" fill="#7030A0">Subnet 10.10.30.0/24</text>
<text x="950.0" y="500" text-anchor="middle" font-size="13" fill="#7030A0">Gateway 10.10.30.1</text>
<line x1="875.0" y1="370" x2="875.0" y2="250" stroke="#7030A0" stroke-width="3"/>
<line x1="1025.0" y1="370" x2="1025.0" y2="250" stroke="#7030A0" stroke-width="3"/>
<text x="950.0" y="305" text-anchor="middle" font-size="12" fill="#7030A0">Access ports</text>
<text x="950.0" y="319" text-anchor="middle" font-size="12" fill="#7030A0">(VLAN 30)</text>
<line x1="600.0" y1="130" x2="600.0" y2="190" stroke="#262626" stroke-width="4"/>
<text x="585.0" y="160" text-anchor="end" font-size="13" font-weight="bold" fill="#262626">Trunk (802.1Q)</text>
<text x="585.0" y="177" text-anchor="end" font-size="12" fill="#262626">carries VLANs 10, 20 and 30</text>
<rect x="100" y="190" width="1000" height="60" rx="10" fill="#E7E6E6" stroke="#595959" stroke-width="2"/>
<text x="600.0" y="226.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#262626">Switch (Layer 2)</text>
<rect x="520" y="60" width="160" height="70" rx="10" fill="#FCE4D6" stroke="#C55A11" stroke-width="2"/>
<text x="600.0" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#262626">Router</text>
<text x="600.0" y="110" text-anchor="middle" font-size="12" fill="#262626">inter-VLAN routing</text>
<text x="705" y="72" font-size="12" font-weight="bold" fill="#C55A11">Gateways (trunk subinterfaces)</text>
<text x="705" y="90" font-size="12" fill="#C55A11">VLAN 10: 10.10.10.1</text>
<text x="705" y="107" font-size="12" fill="#C55A11">VLAN 20: 10.10.20.1</text>
<text x="705" y="124" font-size="12" fill="#C55A11">VLAN 30: 10.10.30.1</text>
<circle cx="600.0" cy="190" r="7" fill="#262626"/>
<circle cx="135.0" cy="250" r="7" fill="#2F5496"/>
<circle cx="285.0" cy="250" r="7" fill="#2F5496"/>
<circle cx="505.0" cy="250" r="7" fill="#2E7D4F"/>
<circle cx="655.0" cy="250" r="7" fill="#2E7D4F"/>
<circle cx="875.0" cy="250" r="7" fill="#7030A0"/>
<circle cx="1025.0" cy="250" r="7" fill="#7030A0"/>
<rect x="85" y="370" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#2F5496" stroke-width="2"/>
<text x="135.0" y="400.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">PC 1</text>
<rect x="235" y="370" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#2F5496" stroke-width="2"/>
<text x="285.0" y="400.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">PC 2</text>
<rect x="455" y="370" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="505.0" y="400.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Server 1</text>
<rect x="605" y="370" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="655.0" y="400.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Server 2</text>
<rect x="825" y="370" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#7030A0" stroke-width="2"/>
<text x="875.0" y="400.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Guest 1</text>
<rect x="975" y="370" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#7030A0" stroke-width="2"/>
<text x="1025.0" y="400.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Guest 2</text>
<text x="40" y="560" font-size="13" fill="#404040">Each VLAN has its own subnet, and the router holds the gateway address for each one (router-on-a-stick).</text>
<text x="40" y="580" font-size="13" fill="#404040">Devices in different VLANs can only reach each other through the router. A Layer 3 switch would use one SVI per VLAN instead.</text>
</svg>