<text x="1020.0" y="355.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Internal web apps</text>
<rect x="920" y="500" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#7030A0" stroke-width="2"/>
<text x="1020.0" y="530.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Remote workers</text>
<text x="372" y="427" text-anchor="middle" font-size="12" font-weight="normal" fill="#7030A0">1  UDP 51820 (VPN tunnel)</text>
<text x="372" y="322" text-anchor="middle" font-size="12" font-weight="normal" fill="#C55A11">2  TCP 443 to web server</text>
<text x="650" y="252" text-anchor="start" font-size="12" font-weight="normal" fill="#C55A11">3  TCP 5432</text>
<text x="650" y="268" text-anchor="start" font-size="12" font-weight="normal" fill="#C55A11">web to database</text>
<text x="802" y="207" text-anchor="start" font-size="11" font-weight="bold" fill="#C00000">4  Denied</text>
<text x="372" y="382" text-anchor="middle" font-size="12" font-weight="normal" fill="#2F5496">5  Staff browsing: TCP 80, 443</text>
<text x="670" y="472" text-anchor="start" font-size="12" font-weight="normal" fill="#7030A0">6  TCP 443</text>
<text x="670" y="488" text-anchor="start" font-size="12" font-weight="normal" fill="#7030A0">to internal web apps</text>
<text x="150" y="472" text-anchor="middle" font-size="12" font-weight="normal" fill="#7F6000">Outside</text>
<text x="150" y="488" text-anchor="middle" font-size="12" font-weight="normal" fill="#7F6000">Firewall public address 203.0.113.2</text>
<text x="1020" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#595959">Inside zones</text>
<text x="40" y="650" font-size="13" fill="#404040">Numbers match the rule table in section 5.4. Solid and dashed arrows are allowed flows; the firewall is stateful, so replies come back automatically.</text>
<text x="40" y="670" font-size="13" fill="#404040">The red cross is a blocked flow. Anything not shown here is blocked by the default-deny rule at the bottom of the table.</text>
</svg>