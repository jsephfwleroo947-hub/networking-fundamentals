<ellipse cx="150.0" cy="360.0" rx="120.0" ry="90.0" fill="#FFF4D6" stroke="#BF9000" stroke-width="2"/>
<text x="150.0" y="358.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#7F6000">Internet</text>
<text x="150.0" y="380.0" text-anchor="middle" font-size="13" fill="#7F6000">(visitors, remote workers)</text>
<rect x="480" y="300" width="240" height="120" rx="12" fill="#F8D7DA" stroke="#C00000" stroke-width="3"/>
<text x="600.0" y="358.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#262626">Firewall</text>
<text x="600.0" y="382.0" text-anchor="middle" font-size="13" fill="#262626">stateful, default-deny</text>
<rect x="510" y="100" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#C55A11" stroke-width="2"/>
<text x="600.0" y="126.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Web server</text>
<text x="600.0" y="143.5" text-anchor="middle" font-size="14" font-weight="normal" fill="#262626">10.10.40.10</text>
<rect x="920" y="90" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#2F5496" stroke-width="2"/>
<text x="1020.0" y="120.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Staff PCs</text>
<rect x="920" y="280" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="1020.0" y="305.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#262626">Database 10.10.20.10</text>
