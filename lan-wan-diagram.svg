<text x="790" y="327" text-anchor="start" font-size="12" fill="#C55A11">WAN side: 198.51.100.2/30</text>
<text x="40" y="484" font-size="13" fill="#404040">Routers sit at the edge of each LAN and forward traffic between sites.</text>
<text x="40" y="504" font-size="13" fill="#404040">Devices inside a LAN talk through the switch; traffic to the other site goes via the router and across the WAN.</text>
